[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impala-sqlglot-plugin"
version = "0.1.0"
description = "Impala dialect plugin for sqlglot"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["sql", "sqlglot", "impala", "dialect", "parser", "transpiler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=30.10.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[project.entry-points."sqlglot.dialects"]
impala = "impala_sqlglot.impala:Impala"

[tool.setuptools.packages.find]
where = ["."]
include = ["impala_sqlglot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "phase0: Phase 0 — foundation and tokenizer tests",
    "phase1: Phase 1 — expressions and literals",
    "phase2: Phase 2 — query shape (FROM, set ops, hints)",
    "phase3: Phase 3 — DML statements",
    "phase4: Phase 4 — DDL and types",
    "phase5: Phase 5 — SHOW, admin, metadata",
]
